name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (Release, x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # -p:Platform is required: the csproj declares x86;x64;ARM64 and has no
      # AnyCPU configuration, so a bare build resolves nothing.
      - name: Restore
        run: dotnet restore win/ace-run.csproj -p:Platform=x64 -r win-x64

      - name: Build
        run: dotnet build win/ace-run.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore

      # No -p:Platform here, and that is the point: AceRun.Core and its tests build AnyCPU
      # and reference nothing from the Windows App SDK, so the suite runs on a machine with
      # no WindowsAppRuntime installed. If this step ever needs the app's platform
      # incantation, something WinUI-shaped has leaked into the logic layer.
      - name: Test
        run: dotnet test test/AceRun.Core.Tests/AceRun.Core.Tests.csproj -c Release
